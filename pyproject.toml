[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "entangled-oracle"
version = "0.0.0"
description = "Local-first astrology report generator."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "CairoSVG",
    "flask",
    "geonamescache",
    "geopy",
    "jinja2",
    "numpy>=2,<2.5",
    "python-docx",
    "pyswisseph",
    "timezonefinder",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
norecursedirs = [
    ".git",
    ".venv",
    "archive",
    "audit_output",
    "entangled-astrology-v0.1",
    "entangled-dashboard-v0.1",
    "output",
    "outputs",
    "quarantine",
    "runtime",
    "tmp",
    "__pycache__",
]
testpaths = [
    "test_offline_location.py",
    "tests",
]

[tool.setuptools]
py-modules = [
    "config",
    "generate",
    "product_versions",
    "run_app",
    "test_offline_location",
]

[tool.setuptools.packages.find]
include = [
    "app*",
    "eia_engine*",
    "engine*",
    "formulas*",
    "products*",
    "selectors*",
    "visuals*",
]
