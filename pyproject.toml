[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "entangled-oracle"
version = "0.0.0"
description = "Local-first astrology report generator."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "geonamescache",
    "geopy",
    "jinja2",
    "pyswisseph",
    "timezonefinder",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
