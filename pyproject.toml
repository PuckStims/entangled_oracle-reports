[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "entangled-oracle"
version = "0.0.0"
description = "Local-first astrology report generator."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask",
    "geonamescache",
    "geopy",
    "jinja2",
    "pyswisseph",
    "timezonefinder",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools]
py-modules = [
    "config",
    "generate",
    "product_versions",
    "run_app",
    "test_offline_location",
]

[tool.setuptools.packages.find]
include = [
    "app*",
    "engine*",
    "formulas*",
    "products*",
    "selectors*",
]
